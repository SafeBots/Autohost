# /etc/apache2/conf.d/autohost.conf  (RHEL: /etc/httpd/conf.d/autohost.conf)
#
# Apache integration for autohost. Installed once by install.sh.
#
# What this does:
#
# 1. Shared ACME HTTP-01 challenge endpoint for ALL hosts on port 80.
#    Lets Let's Encrypt validate any incoming hostname.
#
# 2. Catch-all on port 80 for unknown hosts: serves the static splash
#    over HTTP. mod_security or mod_log_forensic could be configured to
#    pull host header for autohost; we use a CGI-ish mechanism here.
#
# 3. Catch-all on port 443 for unknown hosts: serves the same splash,
#    using the bootstrap self-signed cert. Browser warns; user clicks
#    through; sees splash; refreshes after a minute → real cert.
#
# 4. Per-host vhosts live in <vhost-dir>/<host>.conf (Debian: sites-enabled,
#    RHEL: conf.d). The IncludeOptional directive at the bottom picks them up.
#
# Triggering autohost on unknown-host hits is different from nginx because
# Apache doesn't have a built-in "mirror" directive like nginx does. We use
# mod_rewrite to invoke a small CGI helper (autohost-trigger.sh) that
# does the POST to the Unix socket in the background. Less elegant than
# nginx's mirror but achieves the same effect.
#
# Required Apache modules:
#   - mod_ssl
#   - mod_proxy + mod_proxy_http (for per-host vhost backends)
#   - mod_headers (for HSTS / security headers)
#   - mod_rewrite (for the splash + trigger)
#   - mod_alias (for ACME challenge serving)
#
# HSTS is set on per-host vhosts only, not on catch-all.

# ── Shared ACME challenge access ─────────────────────────────────────────────
# This Directory grants public read on the challenge directory. Each per-host
# vhost AND the catch-all alias it via Alias /.well-known/acme-challenge/...

<Directory "/var/lib/autohost/.well-known/acme-challenge/">
    Require all granted
    Options None
    AllowOverride None
</Directory>

# ── HTTP catch-all (port 80, unknown hosts) ──────────────────────────────────
<VirtualHost *:80>
    ServerName default-autohost
    UseCanonicalName Off

    # ACME challenges served from shared dir
    Alias /.well-known/acme-challenge/ "/var/lib/autohost/.well-known/acme-challenge/"

    # Trigger autohost via a CGI helper. The helper does a one-shot POST to
    # the Unix socket and exits. Apache continues serving the splash to the
    # user while provisioning happens in the background.
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{REQUEST_URI} !^/__autohost-trigger
    RewriteRule ^ /__autohost-trigger?host=%{HTTP_HOST} [L,QSA,PT,E=AUTOVHOST_TRIGGERED:1]

    ScriptAlias /__autohost-trigger /opt/autohost/scripts/autohost-trigger.sh
    <Location /__autohost-trigger>
        Require all granted
        SetHandler cgi-script
        Options +ExecCGI
    </Location>

    # If the trigger ran, serve the splash
    DocumentRoot /etc/autohost
    <Directory "/etc/autohost">
        Require all granted
        Options None
        AllowOverride None
        DirectoryIndex splash.html
    </Directory>
    ErrorDocument 404 /splash.html

    Header always set Cache-Control "no-store, no-cache, must-revalidate"
</VirtualHost>

# ── HTTPS catch-all (port 443, unknown hosts) ────────────────────────────────
<VirtualHost *:443>
    ServerName default-autohost-ssl
    UseCanonicalName Off

    SSLEngine on
    SSLCertificateFile      /etc/autohost/bootstrap.crt
    SSLCertificateKeyFile   /etc/autohost/bootstrap.key
    SSLProtocol             -all +TLSv1.2 +TLSv1.3

    Alias /.well-known/acme-challenge/ "/var/lib/autohost/.well-known/acme-challenge/"

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{REQUEST_URI} !^/__autohost-trigger
    RewriteRule ^ /__autohost-trigger?host=%{HTTP_HOST} [L,QSA,PT,E=AUTOVHOST_TRIGGERED:1]

    ScriptAlias /__autohost-trigger /opt/autohost/scripts/autohost-trigger.sh
    <Location /__autohost-trigger>
        Require all granted
        SetHandler cgi-script
        Options +ExecCGI
    </Location>

    DocumentRoot /etc/autohost
    <Directory "/etc/autohost">
        Require all granted
        Options None
        AllowOverride None
        DirectoryIndex splash.html
    </Directory>
    ErrorDocument 404 /splash.html

    Header always set Cache-Control "no-store, no-cache, must-revalidate"
</VirtualHost>

# ── Per-host vhosts (autohost-managed) ──────────────────────────────────────
# On Debian/Ubuntu: /etc/apache2/sites-enabled/<host>.conf
# On RHEL/Fedora:   /etc/httpd/conf.d/<host>.conf  (autohost writes here)
IncludeOptional /etc/autohost/sites/*.conf
