# apache-templates/vhost-template.conf
#
# Template for per-host Apache VirtualHost configs. autohost reads this
# file at startup and substitutes {{placeholders}} below at provisioning
# time to produce <vhost-dir>/<hostname>.conf.
#
# Operators: customize freely. Restart autohost after editing so it
# re-reads the template.
#
# Available placeholders:
#   {{hostname}}           — customer hostname
#   {{certPath}}           — full path to per-host cert file
#   {{keyPath}}            — full path to per-host key file
#   {{proxyTarget}}        — upstream from config.proxyTarget
#   {{acmeChallengesRoot}} — shared ACME tokens dir (for renewal validation)
#
# Apache variable syntax ($variable, %{HTTP_HOST}) passes through; only
# {{double-curly-brace}} tokens get substituted.

<VirtualHost *:443>
    ServerName {{hostname}}

    SSLEngine on
    SSLCertificateFile      {{certPath}}
    SSLCertificateKeyFile   {{keyPath}}
    SSLProtocol             -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite          HIGH:!aNULL:!MD5
    SSLHonorCipherOrder     on

    # HSTS is NOT set by default. Adding it locks browsers into HTTPS for
    # this hostname for a year, which prevents clean HTTP-first onboarding.
    # To enable (only after TLS is stable across your fleet), uncomment:
    #   Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # ACME challenges for cert renewal
    Alias /.well-known/acme-challenge/ "{{acmeChallengesRoot}}/.well-known/acme-challenge/"
    <Directory "{{acmeChallengesRoot}}/.well-known/acme-challenge/">
        Require all granted
        Options None
    </Directory>

    # Proxy to your application. Customize freely.
    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass         /.well-known/acme-challenge/ !
    ProxyPass         / http://{{proxyTarget}}/
    ProxyPassReverse  / http://{{proxyTarget}}/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"
</VirtualHost>

<VirtualHost *:80>
    ServerName {{hostname}}

    Alias /.well-known/acme-challenge/ "{{acmeChallengesRoot}}/.well-known/acme-challenge/"
    <Directory "{{acmeChallengesRoot}}/.well-known/acme-challenge/">
        Require all granted
        Options None
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [R=301,L]
</VirtualHost>
