# /etc/nginx/conf.d/autohost.conf
#
# nginx integration for autohost. Installed once by install.sh.
#
# What this does:
#
# 1. Shared ACME HTTP-01 challenge endpoint for ALL hosts on port 80.
#    Lets Let's Encrypt validate any incoming hostname against the shared
#    /var/lib/autohost/.well-known/acme-challenge/ directory.
#
# 2. HTTP catch-all (port 80, unknown hosts): serves the static splash
#    directly. No TLS, no warning, nothing to misconfigure. Fires the
#    provisioning trigger via nginx's `mirror` directive in the background.
#    This is THE design surface: a customer's first visit to a freshly-
#    DNS-pointed hostname lands here and they see something pretty.
#
# 3. HTTPS catch-all (port 443, unknown hosts): minimal fallback.
#    Terminates TLS with the bootstrap self-signed cert and serves a short
#    "please use HTTP for now" message. Browsers warn for the self-signed
#    cert, which is correct behavior — there's no real cert for an
#    unprovisioned host. In practice most users never hit this because the
#    HTTP catch-all handles first visits cleanly, then the per-host vhost
#    takes over once provisioning completes.
#
# 4. Per-host vhosts live in /etc/nginx/conf.d/auto/<host>.conf and are
#    included at the bottom via wildcard.
#
# HSTS is NOT set anywhere here. Default vhost templates also don't set
# HSTS. This is deliberate: HSTS on a never-provisioned hostname would
# poison browser state and prevent the clean HTTP-first onboarding.
# Operators who want HSTS can add it to their custom vhost template AFTER
# their fleet's TLS setup is proven stable.

# ── Shared ACME challenge endpoint (port 80, all hosts) ──────────────────────
# This MUST come before the catch-all default_server below so it wins for
# /.well-known/acme-challenge/ on otherwise-unknown hosts.
server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/lib/autohost;
        default_type text/plain;
        try_files $uri =404;
    }
}

# ── HTTP catch-all (port 80, unknown hosts) ──────────────────────────────────
# Serves the splash. Fires provisioning trigger via mirror. Auto-refresh in
# the splash HTML brings the user back to the same URL once the per-host
# vhost is live.
server {
    listen 80 default_server;
    server_name _;

    # Fire-and-forget provisioning trigger via Unix socket.
    location = /__autohost {
        internal;
        proxy_pass http://unix:/run/autohost/autohost.sock:/provision;
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_set_body '{"host":"$host","requestIp":"$remote_addr"}';
        proxy_read_timeout 60s;
        proxy_pass_request_body off;
    }

    # ACME challenges (in case the per-host vhost is being provisioned right
    # now and Let's Encrypt is validating)
    location /.well-known/acme-challenge/ {
        root /var/lib/autohost;
        default_type text/plain;
        try_files $uri =404;
    }

    # Serve the splash for everything else
    location / {
        mirror /__autohost;
        mirror_request_body off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        default_type text/html;
        alias /etc/autohost/splash.html;
        try_files /etc/autohost/splash.html =404;
    }
}

# ── HTTPS catch-all (port 443, unknown hosts) ────────────────────────────────
# Minimal fallback. Self-signed bootstrap cert. Browser warns; user who clicks
# through sees a short "use HTTP for now" message. The HTTP catch-all is the
# real design surface — this exists only so port-443 traffic doesn't fail
# with a TLS handshake error for confused users typing https:// manually.
#
# Still fires the provisioning trigger so things move forward even if the
# user only ever tries HTTPS.
server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/autohost/bootstrap.crt;
    ssl_certificate_key /etc/autohost/bootstrap.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location = /__autohost {
        internal;
        proxy_pass http://unix:/run/autohost/autohost.sock:/provision;
        proxy_method POST;
        proxy_set_header Content-Type application/json;
        proxy_set_body '{"host":"$host","requestIp":"$remote_addr"}';
        proxy_read_timeout 60s;
        proxy_pass_request_body off;
    }

    location / {
        mirror /__autohost;
        mirror_request_body off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        default_type text/html;
        alias /etc/autohost/splash-https.html;
        try_files /etc/autohost/splash-https.html /etc/autohost/splash.html =404;
    }
}

# ── Per-host vhosts (autohost-managed) ──────────────────────────────────────
include /etc/nginx/conf.d/auto/*.conf;
