# nginx-templates/vhost-template.conf
#
# Template for per-host nginx vhost configs. autohost reads this file at
# startup and substitutes the {{placeholders}} below at provisioning time
# to produce /etc/nginx/conf.d/auto/<hostname>.conf.
#
# Operators: customize freely. After editing, restart autohost so it
# reloads the template. Provisioned vhosts won't change retroactively;
# they'll use whichever template was active at provisioning time. Run
# `autohost reissue --all` (TODO) to regenerate every vhost from the
# current template, or remove a per-host .conf and let it re-provision
# on next traffic.
#
# Available placeholders:
#   {{hostname}}            — customer hostname (e.g. "app.example.com")
#   {{certPath}}            — full path to per-host cert file
#   {{keyPath}}             — full path to per-host key file
#   {{proxyTarget}}         — upstream from config.proxyTarget (e.g. "127.0.0.1:3000")
#   {{acmeChallengesRoot}}  — shared ACME tokens dir (for renewal validation)
#
# Multiple occurrences of the same placeholder are all replaced.
# Unknown {{xxx}} tokens are left alone (so curly-braces in body content
# are safe, e.g. nginx variables like ${request_uri} pass through).

server {
    listen 443 ssl http2;
    server_name {{hostname}};

    ssl_certificate     {{certPath}};
    ssl_certificate_key {{keyPath}};
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS is NOT set by default. Adding it locks browsers into HTTPS for
    # this hostname for a year, which prevents the clean HTTP-first onboarding
    # autohost relies on. To enable HSTS (only after your TLS setup is
    # stable across your whole fleet), uncomment:
    #   add_header Strict-Transport-Security "max-age=31536000" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ACME challenge serving for cert renewal. Keep this — without it,
    # cert renewals will fail after the first 90 days.
    location /.well-known/acme-challenge/ {
        root {{acmeChallengesRoot}};
        default_type text/plain;
    }

    # Proxy everything else to your application.
    #
    # Edit this block freely. Common customizations:
    #
    #   - Serve static files from a per-hostname directory:
    #       root /var/www/{{hostname}};
    #       try_files $uri $uri/ @app;
    #       location @app { proxy_pass http://{{proxyTarget}}; }
    #
    #   - Add per-hostname WAF or rate-limit zones
    #
    #   - Route different paths to different upstreams:
    #       location /api/ { proxy_pass http://api-backend:8080; }
    #       location /    { proxy_pass http://{{proxyTarget}}; }
    location / {
        proxy_pass         http://{{proxyTarget}};
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-Host $host;
        proxy_set_header   Connection "";
        proxy_read_timeout 60s;
        proxy_buffering    off;
    }
}

# HTTP → HTTPS redirect for this host. ACME challenges still need to be
# served from the shared dir for renewal validation.
server {
    listen 80;
    server_name {{hostname}};

    location /.well-known/acme-challenge/ {
        root {{acmeChallengesRoot}};
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
